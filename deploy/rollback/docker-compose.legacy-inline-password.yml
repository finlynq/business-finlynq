# One-release emergency adapter for the exact pre-file-secret f8485 app image.
# Always layer this after docker-compose.yml and address only `app --no-deps`.
services:
  app:
    # Exact image ID recorded from the deployed f8485 artifact before release.
    image: sha256:2135e8e936bf8befdc44132771698dfb942fc97dccb19b71eeb3db9f3e5b66b5
    build: !reset null
    pull_policy: never
    entrypoint:
      - /bin/sh
      - /usr/local/bin/business-finlynq-legacy-db-password
    command: ["node", "server.js"]
    environment:
      BUSINESS_FINLYNQ_IMAGE_REVISION: f8485ca86fef5b5fb4a38be9cb4cf3bea5ac2107
      ROLLBACK_COMPATIBILITY_ACK: ${ROLLBACK_COMPATIBILITY_ACK:?set ROLLBACK_COMPATIBILITY_ACK=f8485-one-release-only}
      ACCOUNT_LOGIN_ENABLED: "false"
      ACCOUNT_SIGNUP_ENABLED: "false"
      SIGNUP_TURNSTILE_ENABLED: "false"
      AUTH_EMAIL_DELIVERY_ENABLED: "false"
      BUSINESS_WRITES_ENABLED: "false"
      BANK_FEEDS_ENABLED: "false"
      YAHOO_FX_ENABLED: "false"
      DEMO_LOGIN_ENABLED: "false"
      DEMO_WRITES_ENABLED: "false"
    volumes:
      - type: bind
        source: ./deploy/rollback/legacy-inline-db-password-entrypoint.sh
        target: /usr/local/bin/business-finlynq-legacy-db-password
        read_only: true
