Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
StreamMaxLength 21M
MaxFileSize 32M
MaxScanSize 96M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 45000
MaxThreads 2
MaxQueue 4
ReadTimeout 45
CommandReadTimeout 5
ConcurrentDatabaseReload no
SelfCheck 600
ScanPDF yes
AlertEncrypted yes
AlertExceedsMax yes
EnableShutdownCommand no
FailIfCvdOlderThan 7
