Foreground yes
LocalSocket /upstream/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
StreamMaxLength 21M
MaxFileSize 32M
MaxScanSize 96M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 45000
MaxThreads 3
MaxQueue 6
ReadTimeout 45
CommandReadTimeout 5
ConcurrentDatabaseReload no
SelfCheck 600
ScanPDF yes
AlertEncrypted yes
AlertExceedsMax yes
EnableShutdownCommand no
FailIfCvdOlderThan 7
