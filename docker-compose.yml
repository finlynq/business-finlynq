  business_finlynq_private:
    name: ${BUSINESS_FINLYNQ_PRIVATE_NETWORK:-business_finlynq_private}
    internal: true
  business_finlynq_egress:
    name: ${BUSINESS_FINLYNQ_EGRESS_NETWORK:-business_finlynq_egress}
  business_finlynq_edge:
