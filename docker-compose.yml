name: business-finlynq

services:
  database:
    image: business-finlynq-database:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: database
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    environment:
      POSTGRES_DB: business_finlynq
      POSTGRES_USER: business_finlynq_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_app_db_password
    secrets:
      - business_finlynq_app_db_password
    volumes:
      - business_finlynq_pgdata:/var/lib/postgresql/data
    tmpfs:
      - /run/business-finlynq-init:size=64k,mode=0700,uid=70,gid=70,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_finlynq_owner -d business_finlynq"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    networks: [business_finlynq_private]
    cpus: "1.00"
    mem_limit: 1g
    pids_limit: 256
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  provision_auth_worker_role:
    image: business-finlynq-operations:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: operations
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["/usr/local/bin/business-finlynq-provision-auth-worker-role"]
    environment:
      PGHOST: database
      PGPORT: "5432"
      POSTGRES_DB: business_finlynq
      POSTGRES_USER: business_finlynq_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTH_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_auth_worker_db_password
    secrets:
      - business_finlynq_auth_worker_db_password
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      database:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_private]
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: business-finlynq-migrator:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: migrator
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    environment:
      BUSINESS_FINLYNQ_MIGRATION_DB_HOST: database
      BUSINESS_FINLYNQ_MIGRATION_DB_PORT: "5432"
      BUSINESS_FINLYNQ_MIGRATION_DB_NAME: business_finlynq
      BUSINESS_FINLYNQ_MIGRATION_DB_USER: business_finlynq_owner
      BUSINESS_FINLYNQ_MIGRATION_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BUSINESS_WRITES_ENABLED: ${BUSINESS_WRITES_ENABLED:-false}
    depends_on:
      provision_auth_worker_role:
        condition: service_completed_successfully
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [business_finlynq_private]
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  reconcile_runtime_grants:
    image: business-finlynq-operations:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: operations
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["/usr/local/bin/business-finlynq-reconcile-runtime-role"]
    environment:
      PGHOST: database
      PGPORT: "5432"
      POSTGRES_DB: business_finlynq
      POSTGRES_USER: business_finlynq_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_app_db_password
    secrets:
      - business_finlynq_app_db_password
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_private]
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  reconcile_auth_worker_grants:
    image: business-finlynq-operations:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: operations
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["/usr/local/bin/business-finlynq-provision-auth-worker-role"]
    environment:
      PGHOST: database
      PGPORT: "5432"
      POSTGRES_DB: business_finlynq
      POSTGRES_USER: business_finlynq_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTH_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_auth_worker_db_password
    secrets:
      - business_finlynq_auth_worker_db_password
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      reconcile_runtime_grants:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_private]
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  reconcile_backup_grants:
    image: business-finlynq-operations:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: operations
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["/usr/local/bin/business-finlynq-provision-backup-role"]
    environment:
      PGHOST: database
      PGPORT: "5432"
      POSTGRES_DB: business_finlynq
      POSTGRES_USER: business_finlynq_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_backup_db_password
    secrets:
      - business_finlynq_backup_db_password
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      reconcile_auth_worker_grants:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_private]
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  verify_database_contract:
    image: business-finlynq-migrator:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: migrator
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command:
      - /bin/sh
      - -ec
      - npm run db:verify-schema && npm run journal-types:verify-db
    environment:
      BUSINESS_FINLYNQ_MIGRATION_DB_HOST: database
      BUSINESS_FINLYNQ_MIGRATION_DB_PORT: "5432"
      BUSINESS_FINLYNQ_MIGRATION_DB_NAME: business_finlynq
      BUSINESS_FINLYNQ_MIGRATION_DB_USER: business_finlynq_owner
      BUSINESS_FINLYNQ_MIGRATION_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      reconcile_backup_grants:
        condition: service_completed_successfully
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [business_finlynq_private]
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  bootstrap_demo:
    image: business-finlynq-migrator:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: migrator
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["npm", "run", "demo:bootstrap"]
    environment:
      BUSINESS_FINLYNQ_MIGRATION_DB_HOST: database
      BUSINESS_FINLYNQ_MIGRATION_DB_PORT: "5432"
      BUSINESS_FINLYNQ_MIGRATION_DB_NAME: business_finlynq
      BUSINESS_FINLYNQ_MIGRATION_DB_USER: business_finlynq_owner
      BUSINESS_FINLYNQ_MIGRATION_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ORGANIZATION_ROOT_KEK_FILE: /run/secrets/business_finlynq_root_kek
    secrets:
      - business_finlynq_root_kek
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      verify_database_contract:
        condition: service_completed_successfully
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [business_finlynq_private]
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 96
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  reconcile_demo_sandboxes:
    profiles: [demo-maintenance]
    image: business-finlynq-migrator:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: migrator
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["npm", "run", "demo:reset"]
    environment:
      BUSINESS_FINLYNQ_MIGRATION_DB_HOST: database
      BUSINESS_FINLYNQ_MIGRATION_DB_PORT: "5432"
      BUSINESS_FINLYNQ_MIGRATION_DB_NAME: business_finlynq
      BUSINESS_FINLYNQ_MIGRATION_DB_USER: business_finlynq_owner
      BUSINESS_FINLYNQ_MIGRATION_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ORGANIZATION_ROOT_KEK_FILE: /run/secrets/business_finlynq_root_kek
      DEMO_RESET_MODE: nightly
    secrets:
      - business_finlynq_root_kek
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [business_finlynq_private]
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 96
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  evidence_scanner:
    image: clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    pull_policy: missing
    user: "100:101"
    entrypoint: ["/sbin/tini", "-g", "--", "/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n' "$$CLAMD_CONFIG" > /tmp/finlynq-clamd.conf
        if [ ! -f /var/lib/clamav/main.cvd ]; then
          freshclam --foreground --stdout
        fi
        freshclam --checks=12 --daemon --foreground --stdout --user=clamav &
        exec clamd --foreground --config-file=/tmp/finlynq-clamd.conf
    environment:
      CLAMD_CONFIG: |
        Foreground yes
        LocalSocket /tmp/clamd.sock
        TCPSocket 3310
        DatabaseDirectory /var/lib/clamav
        TemporaryDirectory /tmp
        LogTime yes
        StreamMaxLength 2M
        MaxFileSize 16M
        MaxScanSize 32M
        MaxRecursion 10
        MaxFiles 1000
        MaxScanTime 10000
        MaxThreads 2
        MaxQueue 4
        ReadTimeout 15
        CommandReadTimeout 5
        ConcurrentDatabaseReload no
        SelfCheck 600
        ScanPDF yes
        AlertEncrypted yes
        AlertExceedsMax yes
        EnableShutdownCommand no
        FailIfCvdOlderThan 7
    volumes:
      - business_finlynq_clamav:/var/lib/clamav
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
      - /var/log/clamav:size=8m,uid=100,gid=101,mode=0700
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    networks: [business_finlynq_evidence, business_finlynq_scanner_egress]
    cpus: "1.00"
    mem_limit: 3g
    pids_limit: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: business-finlynq-app:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: runner
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:-unknown}
    environment:
      BUSINESS_FINLYNQ_DB_HOST: database
      BUSINESS_FINLYNQ_DB_PORT: "5432"
      BUSINESS_FINLYNQ_DB_NAME: business_finlynq
      BUSINESS_FINLYNQ_DB_USER: business_finlynq_app
      BUSINESS_FINLYNQ_DB_PASSWORD_FILE: /run/secrets/business_finlynq_app_db_password
      APP_ORIGIN: ${BUSINESS_FINLYNQ_APP_ORIGIN:-https://${BUSINESS_FINLYNQ_HOSTNAME:-business.finlynq.com}}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-business_finlynq_session}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      DEMO_WRITES_ENABLED: ${DEMO_WRITES_ENABLED:-false}
      ACCOUNT_LOGIN_ENABLED: ${ACCOUNT_LOGIN_ENABLED:-false}
      ACCOUNT_SIGNUP_ENABLED: ${ACCOUNT_SIGNUP_ENABLED:-false}
      SIGNUP_TURNSTILE_ENABLED: ${SIGNUP_TURNSTILE_ENABLED:-false}
      SIGNUP_TURNSTILE_SITE_KEY: ${SIGNUP_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/business_finlynq_turnstile_secret_key
      AUTH_EMAIL_DELIVERY_ENABLED: ${AUTH_EMAIL_DELIVERY_ENABLED:-false}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-resend}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_REPLY_TO: ${AUTH_EMAIL_REPLY_TO:-}
      BUSINESS_WRITES_ENABLED: ${BUSINESS_WRITES_ENABLED:-false}
      EVIDENCE_SCANNER_HOST: evidence_scanner
      EVIDENCE_SCANNER_PORT: "3310"
      DOCUMENT_GOOGLE_CLIENT_ID: ${DOCUMENT_GOOGLE_CLIENT_ID:-}
      DOCUMENT_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/business_finlynq_document_google_secret
      DOCUMENT_MICROSOFT_CLIENT_ID: ${DOCUMENT_MICROSOFT_CLIENT_ID:-}
      DOCUMENT_MICROSOFT_CLIENT_SECRET_FILE: /run/secrets/business_finlynq_document_microsoft_secret
      BANK_FEEDS_ENABLED: ${BANK_FEEDS_ENABLED:-false}
      BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:-unknown}
      ORGANIZATION_ROOT_KEK_FILE: /run/secrets/business_finlynq_root_kek
      IDENTITY_SECRET_FILE: /run/secrets/business_finlynq_identity_secret
    secrets:
      - business_finlynq_root_kek
      - business_finlynq_identity_secret
      - business_finlynq_app_db_password
      - business_finlynq_turnstile_secret_key
      - business_finlynq_document_google_secret
      - business_finlynq_document_microsoft_secret
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    ports:
      - "127.0.0.1:${BUSINESS_FINLYNQ_APP_PORT:-3100}:3000"
    depends_on:
      bootstrap_demo:
        condition: service_completed_successfully
      evidence_scanner:
        condition: service_healthy
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    networks:
      business_finlynq_private:
      business_finlynq_egress:
      business_finlynq_evidence:
      business_finlynq_edge:
        aliases:
          - ${BUSINESS_FINLYNQ_APP_NETWORK_ALIAS:-production-app}
    cpus: "1.00"
    mem_limit: 768m
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  auth_email_worker:
    profiles: [auth-email]
    image: business-finlynq-auth-worker:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: worker
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["node", "auth-email-worker.mjs"]
    environment:
      BUSINESS_FINLYNQ_DB_HOST: database
      BUSINESS_FINLYNQ_DB_PORT: "5432"
      BUSINESS_FINLYNQ_DB_NAME: business_finlynq
      BUSINESS_FINLYNQ_DB_USER: business_finlynq_auth_worker
      BUSINESS_FINLYNQ_DB_PASSWORD_FILE: /run/secrets/business_finlynq_auth_worker_db_password
      APP_ORIGIN: ${BUSINESS_FINLYNQ_APP_ORIGIN:-https://${BUSINESS_FINLYNQ_HOSTNAME:-business.finlynq.com}}
      ACCOUNT_LOGIN_ENABLED: ${ACCOUNT_LOGIN_ENABLED:-false}
      AUTH_EMAIL_DELIVERY_ENABLED: ${AUTH_EMAIL_DELIVERY_ENABLED:-false}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-resend}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_REPLY_TO: ${AUTH_EMAIL_REPLY_TO:-}
      RESEND_API_KEY_FILE: /run/secrets/business_finlynq_resend_api_key
      IDENTITY_SECRET_FILE: /run/secrets/business_finlynq_identity_secret
    secrets:
      - business_finlynq_identity_secret
      - business_finlynq_resend_api_key
      - business_finlynq_auth_worker_db_password
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      bootstrap_demo:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    networks:
      - business_finlynq_private
      - business_finlynq_egress
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 96
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  release_acceptance:
    profiles: [acceptance]
    image: business-finlynq-acceptance:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: acceptance
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    environment:
      PLAYWRIGHT_BASE_URL: ${BUSINESS_FINLYNQ_APP_ORIGIN:-https://${BUSINESS_FINLYNQ_HOSTNAME:-business.finlynq.com}}
      PLAYWRIGHT_MANAGED_SERVER: "true"
      E2E_EXPECT_ACCOUNT_LOGIN_ENABLED: ${ACCOUNT_LOGIN_ENABLED:-false}
      E2E_EXPECT_ACCOUNT_SIGNUP_ENABLED: ${ACCOUNT_SIGNUP_ENABLED:-false}
      # Playwright removes its output directories before every run. Keep the
      # removable directories below, rather than at, the tmpfs mountpoints.
      PLAYWRIGHT_HTML_OUTPUT_DIR: /app/playwright-report/release
      HOME: /tmp/playwright-home
      npm_config_cache: /tmp/npm-cache
    command: ["./node_modules/.bin/playwright", "test", "--output", "/app/test-results/release"]
    user: pwuser
    network_mode: host
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/test-results:size=256m,mode=1777
      - /app/playwright-report:size=64m,mode=1777
    shm_size: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    stdin_open: false
    tty: false
    cpus: "1.00"
    mem_limit: 1536m
    pids_limit: 256
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  invite_account:
    profiles: [account-operations]
