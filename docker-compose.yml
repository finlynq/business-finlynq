  restore_demo_bootstrap:
    profiles: [restore-drill]
    image: business-finlynq-migrator:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: migrator
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command:
      - sh
      - -c
      - export BUSINESS_FINLYNQ_MIGRATION_DB_PASSWORD="$$(cat /run/secrets/business_finlynq_restore_db_password)" && npm run demo:bootstrap && DEMO_RESET_MODE=nightly exec npm run demo:reset
    environment:
      BUSINESS_FINLYNQ_MIGRATION_DB_HOST: restore_database
      BUSINESS_FINLYNQ_MIGRATION_DB_PORT: "5432"
      BUSINESS_FINLYNQ_MIGRATION_DB_NAME: business_finlynq_restore_drill
      BUSINESS_FINLYNQ_MIGRATION_DB_USER: restore_drill_owner
      ORGANIZATION_ROOT_KEK_FILE: /run/secrets/business_finlynq_root_kek
    secrets:
      - business_finlynq_restore_db_password
      - business_finlynq_root_kek
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      restore_key_verify:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_restore_drill]
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 96
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  restore_key_verify:
    profiles: [restore-drill]
    image: business-finlynq-migrator:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: migrator
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command:
      - sh
      - -c
      - export BUSINESS_FINLYNQ_DB_PASSWORD="$$(cat /run/secrets/business_finlynq_restore_db_password)" && exec npx --no-install tsx scripts/operations/verify-restored-secrets.ts
    environment:
      BUSINESS_FINLYNQ_DB_HOST: restore_database
      BUSINESS_FINLYNQ_DB_PORT: "5432"
      BUSINESS_FINLYNQ_DB_NAME: business_finlynq_restore_drill
      BUSINESS_FINLYNQ_DB_USER: restore_drill_owner
      ORGANIZATION_ROOT_KEK_FILE: /run/secrets/business_finlynq_root_kek
      IDENTITY_SECRET_FILE: /run/secrets/business_finlynq_identity_secret
      RESTORE_REQUIRE_WRAPPED_KEYS: ${RESTORE_REQUIRE_WRAPPED_KEYS:-true}
      RESTORE_ALLOW_EMPTY_SECRET_FIXTURES: ${RESTORE_ALLOW_EMPTY_SECRET_FIXTURES:-false}
      RESTORE_EVIDENCE_DIR: ${RESTORE_EVIDENCE_DIR:-}
      RESTORE_EVIDENCE_ID: ${RESTORE_EVIDENCE_ID:-}
      RESTORE_SELECTED_SHA256: ${RESTORE_SELECTED_SHA256:-}
      RESTORE_SELECTED_ARCHIVE: ${RESTORE_SELECTED_ARCHIVE:-}
    secrets:
      - business_finlynq_restore_db_password
      - business_finlynq_root_kek
      - business_finlynq_identity_secret
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    # The operations verifier creates /backups/restore-reports as uid 70 with
    # a private umask. Use that same non-root uid for the Node key verifier so
    # the first drill can append its evidence without relaxing the directory.
    user: "70:70"
    volumes:
      - type: bind
        source: ${BACKUP_LOCAL_DIR:-./.backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      restore_accounting_verify:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_restore_drill]
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 96
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  restore_app:
    profiles: [restore-drill]
    image: business-finlynq-app:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: runner
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    environment:
      BUSINESS_FINLYNQ_DB_HOST: restore_database
      BUSINESS_FINLYNQ_DB_PORT: "5432"
      BUSINESS_FINLYNQ_DB_NAME: business_finlynq_restore_drill
      BUSINESS_FINLYNQ_DB_USER: business_finlynq_app
      BUSINESS_FINLYNQ_DB_PASSWORD_FILE: /run/secrets/business_finlynq_app_db_password
      # Stateful routes keep the production HTTPS origin contract. The drill
      # verifier reaches this container over the isolated network and never
      # follows its external redirect target.
      APP_ORIGIN: https://${BUSINESS_FINLYNQ_HOSTNAME:-business.finlynq.com}
      SESSION_COOKIE_NAME: business_finlynq_restore_session
      DEMO_LOGIN_ENABLED: "true"
      # Restore verification is deliberately degraded/read-only. Sandbox reset
      # operators and maintenance timers are not part of this drill surface.
      DEMO_WRITES_ENABLED: "false"
      ACCOUNT_LOGIN_ENABLED: "false"
      ACCOUNT_SIGNUP_ENABLED: "false"
      SIGNUP_TURNSTILE_ENABLED: "false"
      AUTH_EMAIL_DELIVERY_ENABLED: "false"
      BUSINESS_WRITES_ENABLED: "false"
      BANK_FEEDS_ENABLED: "false"
      BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:-unknown}
      ORGANIZATION_ROOT_KEK_FILE: /run/secrets/business_finlynq_root_kek
      IDENTITY_SECRET_FILE: /run/secrets/business_finlynq_identity_secret
    secrets:
      - business_finlynq_root_kek
      - business_finlynq_identity_secret
      - business_finlynq_app_db_password
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    depends_on:
      restore_demo_bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_restore_drill]
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  restore_runtime_verify:
    profiles: [restore-drill]
    image: business-finlynq-operations:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    build:
      context: .
      target: operations
      args:
        BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    command: ["/usr/local/bin/business-finlynq-verify-restored-runtime"]
    environment:
      PGHOST: restore_database
      PGPORT: "5432"
      PGDATABASE: business_finlynq_restore_drill
      APP_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_app_db_password
      AUTH_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_auth_worker_db_password
      BACKUP_DATABASE_PASSWORD_FILE: /run/secrets/business_finlynq_backup_db_password
      RESTORE_APP_URL: http://restore_app:3000
      RESTORE_EXPECTED_APP_ORIGIN: https://${BUSINESS_FINLYNQ_HOSTNAME:-business.finlynq.com}
      RESTORE_ALLOWED_HOST: restore_database
      RESTORE_CONFIRM_DISPOSABLE: business-finlynq-restore-drill
      RESTORE_EVIDENCE_DIR: ${RESTORE_EVIDENCE_DIR:-}
      RESTORE_EVIDENCE_ID: ${RESTORE_EVIDENCE_ID:-}
      RESTORE_SELECTED_SHA256: ${RESTORE_SELECTED_SHA256:-}
      RESTORE_SELECTED_ARCHIVE: ${RESTORE_SELECTED_ARCHIVE:-}
      RESTORE_DRILL_STARTED_AT: ${RESTORE_DRILL_STARTED_AT:-}
    secrets:
      - business_finlynq_app_db_password
      - business_finlynq_auth_worker_db_password
      - business_finlynq_backup_db_password
    group_add:
      - ${BUSINESS_FINLYNQ_SECRET_GID:?set BUSINESS_FINLYNQ_SECRET_GID}
    volumes:
      - type: bind
        source: ${BACKUP_LOCAL_DIR:-./.backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      restore_app:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    networks: [business_finlynq_restore_drill]
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  restore_evidence:
    profiles: [restore-drill]
    image: business-finlynq-operations:${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
    pull_policy: never
    command: ["/usr/local/bin/business-finlynq-record-restore-evidence"]
    environment:
      BACKUP_OUTPUT_DIR: /backups
      BACKUP_MANIFEST: ${RESTORE_BACKUP_MANIFEST:-}
      RESTORE_DRILL_STARTED_AT: ${RESTORE_DRILL_STARTED_AT:-}
      RESTORE_DRILL_COMPLETED_AT: ${RESTORE_DRILL_COMPLETED_AT:-}
      RESTORE_RPO_SECONDS: ${RESTORE_RPO_SECONDS:-21600}
      RESTORE_RTO_SECONDS: ${RESTORE_RTO_SECONDS:-14400}
      RESTORE_REQUIRE_OFFSITE_EVIDENCE: ${RESTORE_REQUIRE_OFFSITE_EVIDENCE:-true}
      RESTORE_ALLOW_EMPTY_SECRET_FIXTURES: ${RESTORE_ALLOW_EMPTY_SECRET_FIXTURES:-false}
      BACKUP_RECEIVER_RECEIPT_PUBLIC_KEY_FILE: /run/secrets/business_finlynq_backup_receiver_receipt_public_key
      BACKUP_RECEIVER_RECEIPT_PUBLIC_KEY_SHA256: ${BACKUP_RECEIVER_RECEIPT_PUBLIC_KEY_SHA256:-}
      BUSINESS_FINLYNQ_IMAGE_REVISION: ${BUSINESS_FINLYNQ_IMAGE_REVISION:?set BUSINESS_FINLYNQ_IMAGE_REVISION}
      RESTORE_APP_IMAGE_ID: ${RESTORE_APP_IMAGE_ID:-}
      RESTORE_MIGRATOR_IMAGE_ID: ${RESTORE_MIGRATOR_IMAGE_ID:-}
      RESTORE_OPERATIONS_IMAGE_ID: ${RESTORE_OPERATIONS_IMAGE_ID:-}
    secrets:
      - business_finlynq_backup_receiver_receipt_public_key
    volumes:
      - type: bind
        source: ${BACKUP_LOCAL_DIR:-./.backups}
        target: /backups
        bind:
          create_host_path: false
    network_mode: none
    user: "70:70"
    stdin_open: false
    tty: false
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 32
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  business_finlynq_clamav:
    name: ${BUSINESS_FINLYNQ_PGDATA_VOLUME:-business_finlynq_pgdata}_clamav
  business_finlynq_pgdata:
    name: ${BUSINESS_FINLYNQ_PGDATA_VOLUME:-business_finlynq_pgdata}
