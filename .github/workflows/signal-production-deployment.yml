name: signal-production-deployment

on:
  workflow_run:
    workflows:
      - quality-gate
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: production-deployment-signal
  cancel-in-progress: false

jobs:
  signal:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Publish immutable production deployment signal
        env:
          CANDIDATE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[a-f0-9]{40}$ && ! "$CANDIDATE_REVISION" =~ ^0+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_REVISION"

          tag="deploy-production-$CANDIDATE_REVISION"
          existing="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 {print $1}')"
          if [[ -n "$existing" ]]; then
            test "$existing" = "$CANDIDATE_REVISION"
            exit 0
          fi

          git tag "$tag" "$CANDIDATE_REVISION"
          git push origin "refs/tags/$tag:refs/tags/$tag"
