name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: business_finlynq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_finlynq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_PASSWORD: postgres
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/business_finlynq_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/business_finlynq_test
      TEST_APP_DATABASE_URL: postgresql://business_finlynq_app:runtime-test-only-password-2026@127.0.0.1:5432/business_finlynq_test
      TEST_AUTH_WORKER_DATABASE_URL: postgresql://business_finlynq_auth_worker:auth-worker-test-only-2026@127.0.0.1:5432/business_finlynq_test
      DATABASE_URL: postgresql://business_finlynq_app:runtime-test-only-password-2026@127.0.0.1:5432/business_finlynq_test
      APP_ORIGIN: http://127.0.0.1:3000
      SESSION_COOKIE_NAME: business_finlynq_session
      DEMO_LOGIN_ENABLED: "true"
      DEMO_WRITES_ENABLED: "true"
      ACCOUNT_LOGIN_ENABLED: "false"
      AUTH_EMAIL_DELIVERY_ENABLED: "false"
      BUSINESS_WRITES_ENABLED: "false"
      # Job-level env is validated before the runner context exists. Hosted
      # Ubuntu runners provide a private, ephemeral /tmp for these CI-only files.
      ORGANIZATION_ROOT_KEK_FILE: /tmp/business-finlynq-root-kek
      IDENTITY_SECRET_FILE: /tmp/business-finlynq-identity-secret
      APP_DATABASE_PASSWORD_FILE: /tmp/business-finlynq-app-db-password
      AUTH_WORKER_DATABASE_PASSWORD_FILE: /tmp/business-finlynq-auth-worker-db-password
      BACKUP_DATABASE_PASSWORD_FILE: /tmp/business-finlynq-backup-db-password
      BUSINESS_FINLYNQ_SECRET_GID: "20001"
      BUSINESS_FINLYNQ_IMAGE_REVISION: ${{ github.sha }}
      BUSINESS_FINLYNQ_CI_DATABASE_GUARD: business-finlynq-disposable-ci-databases
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Drizzle declaration and snapshot agreement
        run: npm run db:check-drift
      - name: Verify generated journal-type seed contract
        run: npm run journal-types:check-seed
      - name: Create ephemeral CI encryption secrets
        run: node -e "const fs=require('node:fs'),c=require('node:crypto');fs.writeFileSync(process.env.ORGANIZATION_ROOT_KEK_FILE,c.randomBytes(32).toString('base64')+'\n',{mode:0o600});fs.writeFileSync(process.env.IDENTITY_SECRET_FILE,c.randomBytes(64).toString('base64')+'\n',{mode:0o600});fs.writeFileSync(process.env.APP_DATABASE_PASSWORD_FILE,'runtime-test-only-password-2026\n',{mode:0o600});fs.writeFileSync(process.env.AUTH_WORKER_DATABASE_PASSWORD_FILE,'auth-worker-test-only-2026\n',{mode:0o600});fs.writeFileSync(process.env.BACKUP_DATABASE_PASSWORD_FILE,'backup-test-only-password-2026\n',{mode:0o600})"
      - name: Validate operations shell syntax
        run: find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Verify off-server backup receiver security invariants
        run: bash deploy/backup-receiver/test-static.sh
      - name: Verify fail-safe deployment-secret bootstrap
        run: |
          bootstrap_root="$(mktemp -d)"
          trap 'rm -rf -- "$bootstrap_root"' EXIT
          mkdir -p "$bootstrap_root/project"
          BUSINESS_FINLYNQ_SECRET_DIR="$bootstrap_root/secrets" sh deploy/bootstrap-demo-secrets.sh "$bootstrap_root/project"
          grep -q '^APP_DATABASE_PASSWORD_FILE=' "$bootstrap_root/project/.env"
          grep -q '^AUTH_WORKER_DATABASE_PASSWORD_FILE=' "$bootstrap_root/project/.env"
          grep -q '^BACKUP_DATABASE_PASSWORD_FILE=' "$bootstrap_root/project/.env"
          test -s "$bootstrap_root/secrets/app-db-password"
          test -s "$bootstrap_root/secrets/auth-worker-db-password"
          test -s "$bootstrap_root/secrets/backup-db-password"
          test "$(stat -c '%a' "$bootstrap_root/secrets/app-db-password")" = "440"
          test "$(stat -c '%a' "$bootstrap_root/secrets/auth-worker-db-password")" = "440"
          test "$(stat -c '%a' "$bootstrap_root/secrets/backup-db-password")" = "440"
          if BUSINESS_FINLYNQ_SECRET_DIR="$bootstrap_root/secrets" sh deploy/bootstrap-demo-secrets.sh "$bootstrap_root/project"; then
            echo 'secret bootstrap overwrote existing material' >&2
            exit 1
          fi
      - name: Verify Compose credential and network boundaries
        run: node scripts/operations/verify-compose-boundaries.mjs
      - name: Verify scheduled operations paths and reset boundaries
        run: node scripts/operations/verify-scheduled-operations.mjs
      - run: npm run lint
      - run: npm run typecheck
      - name: Provision non-owner runtime role
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
        run: sh deploy/postgres/010-runtime-role.sh
      - name: Provision least-privilege authentication worker role
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
        run: sh deploy/postgres/015-auth-worker-role.sh
      - name: Provision read-only cross-tenant backup role
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
        run: sh deploy/postgres/020-backup-role.sh
      - name: Verify supported predecessor upgrade preserves tenant data
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGPASSWORD: postgres
        run: bash scripts/operations/verify-ci-database-lifecycle.sh predecessor-upgrade
      - run: npm run db:migrate
      - name: Inject stale runtime and backup privileges for reconciliation coverage
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: business_finlynq_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql --no-password --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE business_finlynq_backup_inherited_stale NOLOGIN;
          CREATE ROLE business_finlynq_backup_delegate_stale NOLOGIN;
          CREATE ROLE business_finlynq_runtime_inherited_stale NOLOGIN;
          GRANT business_finlynq_backup_inherited_stale TO business_finlynq_backup;
          GRANT business_finlynq_backup TO business_finlynq_backup_delegate_stale;
          GRANT business_finlynq_runtime_inherited_stale TO business_finlynq_app;
          GRANT DELETE ON organizations TO business_finlynq_runtime_inherited_stale;
          ALTER ROLE business_finlynq_app BYPASSRLS INHERIT CONNECTION LIMIT 99;
          GRANT CREATE ON DATABASE business_finlynq_test TO business_finlynq_app;
          GRANT TEMPORARY ON DATABASE business_finlynq_test TO PUBLIC;
          GRANT CREATE ON SCHEMA public TO business_finlynq_app;
          GRANT CREATE ON SCHEMA public TO PUBLIC;
          GRANT SELECT ON organizations TO PUBLIC;
          GRANT SELECT (email_ciphertext) ON users TO PUBLIC;
          GRANT SELECT (id) ON organizations TO business_finlynq_app;
          GRANT EXECUTE ON FUNCTION public.digest(text, text) TO PUBLIC;
          GRANT EXECUTE ON FUNCTION app.current_organization_id() TO PUBLIC;
          GRANT EXECUTE ON FUNCTION app.guard_posted_journal_entry() TO business_finlynq_app;
          CREATE SEQUENCE ci_runtime_acl_sequence;
          GRANT USAGE ON SEQUENCE ci_runtime_acl_sequence TO business_finlynq_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT SELECT ON TABLES TO PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT EXECUTE ON FUNCTIONS TO PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT INSERT ON TABLES TO business_finlynq_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT EXECUTE ON FUNCTIONS TO business_finlynq_app;
          GRANT INSERT, UPDATE ON organizations TO business_finlynq_backup;
          GRANT USAGE, UPDATE ON ALL SEQUENCES IN SCHEMA public TO business_finlynq_backup;
          CREATE POLICY ci_schema_verifier_leak ON public.organizations
            FOR ALL TO PUBLIC
            USING (true)
            WITH CHECK (true);
          SQL
      - name: Prove a permissive tenant RLS policy fails schema verification
        run: |
          set +e
          npm run db:verify-schema >"$RUNNER_TEMP/permissive-rls-policy-verifier.log" 2>&1
          verifier_status=$?
          set -e
          if [ "$verifier_status" -eq 0 ]; then
            echo "Schema verification accepted a deliberately permissive tenant RLS policy" >&2
            exit 1
          fi
          grep -Fq \
            '[RLS_POLICY_EXTRA] public.organizations has unreviewed RLS policy ci_schema_verifier_leak' \
            "$RUNNER_TEMP/permissive-rls-policy-verifier.log"
      - name: Prove stale default privileges fail schema verification
        run: |
          set +e
          npm run db:verify-schema >"$RUNNER_TEMP/stale-default-privilege-verifier.log" 2>&1
          verifier_status=$?
          set -e
          if [ "$verifier_status" -eq 0 ]; then
            echo "Schema verification accepted deliberately stale privileges" >&2
            exit 1
          fi
          grep -Fq \
            '[UNSAFE_DEFAULT_PRIVILEGE] PUBLIC receives EXECUTE on future function objects in <global> defaults owned by postgres' \
            "$RUNNER_TEMP/stale-default-privilege-verifier.log"
          grep -Fq \
            '[UNSAFE_ROLE_ATTRIBUTE] business_finlynq_app.can_bypass_rls is true; expected false' \
            "$RUNNER_TEMP/stale-default-privilege-verifier.log"
          grep -Fq \
            '[UNSAFE_DATABASE_GRANT] PUBLIC has TEMPORARY on the application database' \
            "$RUNNER_TEMP/stale-default-privilege-verifier.log"
          grep -Fq \
            '[UNSAFE_SCHEMA_GRANT] PUBLIC has CREATE on schema public' \
            "$RUNNER_TEMP/stale-default-privilege-verifier.log"
          grep -Fq \
            '[UNSAFE_OBJECT_GRANT] business_finlynq_app has USAGE on sequence public.ci_runtime_acl_sequence' \
            "$RUNNER_TEMP/stale-default-privilege-verifier.log"
          grep -Fq \
            '[EXTRA_FUNCTION_GRANT] business_finlynq_app has unreviewed direct EXECUTE on app.guard_posted_journal_entry()' \
            "$RUNNER_TEMP/stale-default-privilege-verifier.log"
          grep -Fq \
            '[UNSAFE_COLUMN_GRANT] business_finlynq_app has unreviewed direct SELECT on public.organizations.id' \
            "$RUNNER_TEMP/stale-default-privilege-verifier.log"
      - name: Remove the deliberate permissive tenant RLS policy
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: business_finlynq_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql --no-password --set=ON_ERROR_STOP=1 --command 'DROP POLICY ci_schema_verifier_leak ON public.organizations'
      - name: Reconcile reviewed runtime grants after migrations
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
        run: sh deploy/postgres/010-runtime-role.sh
      - name: Reconcile authentication-worker grants after migrations
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
        run: sh deploy/postgres/015-auth-worker-role.sh
      - name: Reconcile backup grants after migrations
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
        run: sh deploy/postgres/020-backup-role.sh
      - name: Verify migrated schema, declarations, and tenant RLS
        run: npm run db:verify-schema
      - name: Verify database journal types match the module manifests
        run: npm run journal-types:verify-db
      - name: Verify backup role bypasses tenant RLS but cannot mutate
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: business_finlynq_test
          PGUSER: business_finlynq_backup
          PGPASSWORD: backup-test-only-password-2026
        run: |
          test "$(psql --no-password --tuples-only --no-align --command 'SHOW default_transaction_read_only')" = "on"
          test "$(psql --no-password --tuples-only --no-align --command 'SELECT count(*) > 0 FROM organizations')" = "t"
          if psql --no-password --set=ON_ERROR_STOP=1 --command "SET default_transaction_read_only = off; UPDATE organizations SET active = active"; then
            echo 'backup role unexpectedly mutated a tenant table' >&2
            exit 1
          fi
          pg_dump --no-password --format=custom --no-owner --no-privileges --file=/tmp/business-finlynq-backup-role-smoke.dump
          pg_restore --list /tmp/business-finlynq-backup-role-smoke.dump > /tmp/business-finlynq-backup-role-smoke.list
          grep -q 'TABLE DATA public organizations' /tmp/business-finlynq-backup-role-smoke.list
      - name: Remove backup reconciliation test roles
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: business_finlynq_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql --no-password --set=ON_ERROR_STOP=1 --command 'DROP ROLE business_finlynq_backup_inherited_stale'
          psql --no-password --set=ON_ERROR_STOP=1 --command 'DROP ROLE business_finlynq_backup_delegate_stale'
          psql --no-password --set=ON_ERROR_STOP=1 --command 'DROP OWNED BY business_finlynq_runtime_inherited_stale'
          psql --no-password --set=ON_ERROR_STOP=1 --command 'DROP ROLE business_finlynq_runtime_inherited_stale'
          psql --no-password --set=ON_ERROR_STOP=1 --command 'DROP SEQUENCE ci_runtime_acl_sequence'
      # TEST_DATABASE_URL enables the PostgreSQL integration suite inside the
      # normal Vitest run. Run it once, after replaying the canonical migrations.
      - name: Bootstrap the fixed public demo and sandbox pool
        run: npm run demo:bootstrap
      - name: Exercise nightly demo-sandbox reconciliation
        run: DEMO_RESET_MODE=nightly npm run demo:reset
      - run: npm run test
      - name: Verify audit graph and request/outbox lineage
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: business_finlynq_test
          PGUSER: business_finlynq_backup
          ACCOUNTING_EVIDENCE_DATABASE_PASSWORD_FILE: /tmp/business-finlynq-backup-db-password
          ACCOUNTING_EVIDENCE_QUERY_FILE: scripts/operations/accounting-evidence-query.sql
        run: bash deploy/backup/verify-accounting-evidence.sh
      - name: Dump and restore the populated database into an isolated sibling
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGPASSWORD: postgres
        run: bash scripts/operations/verify-ci-database-lifecycle.sh restore
      - run: npm run build
      - name: Build hardened operations and email-worker images
        run: |
          docker build --target operations --build-arg BUSINESS_FINLYNQ_IMAGE_REVISION="$BUSINESS_FINLYNQ_IMAGE_REVISION" --tag business-finlynq-operations-ci .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' business-finlynq-operations-ci)" = "$BUSINESS_FINLYNQ_IMAGE_REVISION"
          docker run --rm --network none --read-only --user 70:70 --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 0.25 --entrypoint /bin/sh business-finlynq-operations-ci -ec 'test "$(stat -c "%u:%g:%a:%F" /usr/local/share/business-finlynq)" = "0:0:555:directory" && test "$(stat -c "%u:%g:%a:%F" /usr/local/share/business-finlynq/accounting-evidence-query.sql)" = "0:0:444:regular file" && test -f /usr/local/share/business-finlynq/accounting-evidence-query.sql && test -r /usr/local/share/business-finlynq/accounting-evidence-query.sql && test ! -L /usr/local/share/business-finlynq/accounting-evidence-query.sql'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 0.25 --mount "type=bind,source=$PWD/deploy/backup,target=/tests,readonly" --entrypoint /bin/bash business-finlynq-operations-ci /tests/test-latest-backup-verifier.sh
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 0.25 --mount "type=bind,source=$PWD/deploy/backup,target=/tests,readonly" --entrypoint /bin/bash business-finlynq-operations-ci /tests/test-restore-evidence-recorder.sh
          docker build --target worker --tag business-finlynq-auth-worker-ci .
          docker run --rm --entrypoint sh business-finlynq-auth-worker-ci -c 'test -f /app/auth-email-worker.mjs && test ! -e /app/src && test ! -e /app/tests && ! node -e "require.resolve(\"tsx\")"'
      - name: Install release-gate browser
        run: npx playwright install --with-deps chromium
      - name: Run browser release gate
        run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
