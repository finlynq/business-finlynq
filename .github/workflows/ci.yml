name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: business_finlynq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_finlynq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/business_finlynq_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/business_finlynq_test
      TEST_APP_DATABASE_URL: postgresql://business_finlynq_app:runtime-test-only@127.0.0.1:5432/business_finlynq_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Provision non-owner runtime role
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: business_finlynq_test
          PGPASSWORD: postgres
          APP_DATABASE_PASSWORD: runtime-test-only
        run: sh deploy/postgres/010-runtime-role.sh
      - run: npm run db:migrate
      # TEST_DATABASE_URL enables the PostgreSQL integration suite inside the
      # normal Vitest run. Run it once, after replaying the canonical migrations.
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
